[package]
name = "governed-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Governed memory engine with tenant ACL, current revisions, and correct/forget"
repository = "https://github.com/dingzhou6/governed-memory"
publish = false

[features]
benchmark-trace = ["tokio/rt"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["arbitrary_precision"] }
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
thiserror = { version = "=2.0.20", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["time"] }

[dev-dependencies]
calamine = { version = "=0.36.1", default-features = false }
csv = { version = "=1.4.0", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }
http-body = { version = "=1.1.0", default-features = false }
ooxmlsdk = { version = "=0.13.0", default-features = false, features = ["parts"] }
oxidize-pdf = "=4.3.0"
quick-xml = { version = "=0.41.0", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
zip = { version = "=8.6.0", default-features = false }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
